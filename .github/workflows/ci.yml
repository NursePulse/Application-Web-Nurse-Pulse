name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Run unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Lighthouse audit (deployed sign-in page)
        run: npx lighthouse https://application-web-nurse-pulse.vercel.app/sign-in --chrome-flags="--headless --no-sandbox" --output=json --output=html --output-path=./lighthouse-report --quiet
        continue-on-error: true

      - name: Upload Lighthouse report
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: lighthouse-report.report.*
        continue-on-error: true
